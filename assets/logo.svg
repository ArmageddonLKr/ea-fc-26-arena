<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="40%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#c89010"/>
    </linearGradient>
    <linearGradient id="bolt-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-grad)"/>

  <!-- Outer red ring segments (dashed/segmented) -->
  <g filter="url(#glow-red)">
    <!-- Top-left arc segment -->
    <path d="M 256 24 A 232 232 0 0 0 82 108" stroke="url(#ring-grad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Top-right arc segment -->
    <path d="M 256 24 A 232 232 0 0 1 430 108" stroke="url(#ring-grad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Bottom-left arc segment -->
    <path d="M 82 404 A 232 232 0 0 0 256 488" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Bottom-right arc segment -->
    <path d="M 430 404 A 232 232 0 0 1 256 488" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Thin accent ring -->
  <circle cx="256" cy="256" r="220" stroke="#1e1e36" stroke-width="1" fill="none"/>

  <!-- Main hexagon body -->
  <path d="M 256 56
           L 434 158
           L 434 354
           L 256 456
           L 78 354
           L 78 158 Z"
        fill="url(#hex-grad)"
        filter="url(#shadow)"/>

  <!-- Hexagon red border -->
  <path d="M 256 56
           L 434 158
           L 434 354
           L 256 456
           L 78 354
           L 78 158 Z"
        stroke="url(#ring-grad)" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Inner hexagon accent lines -->
  <path d="M 256 86
           L 410 172
           L 410 340
           L 256 426
           L 102 340
           L 102 172 Z"
        stroke="rgba(139,92,246,0.18)" stroke-width="1" fill="none"/>

  <!-- Corner accent dots (red) -->
  <circle cx="256" cy="56" r="5" fill="#7c3aed" filter="url(#glow-red)"/>
  <circle cx="434" cy="158" r="4" fill="#7c3aed" opacity="0.7"/>
  <circle cx="434" cy="354" r="4" fill="#7c3aed" opacity="0.7"/>
  <circle cx="256" cy="456" r="5" fill="#7c3aed" filter="url(#glow-red)"/>
  <circle cx="78" cy="354" r="4" fill="#7c3aed" opacity="0.7"/>
  <circle cx="78" cy="158" r="4" fill="#7c3aed" opacity="0.7"/>

  <!-- Lightning bolt — main shape, gold -->
  <g filter="url(#glow-gold)">
    <path d="M 290 108
             L 198 274
             L 248 274
             L 222 404
             L 318 222
             L 266 222
             L 326 108 Z"
          fill="url(#bolt-grad)"/>
    <!-- Bolt highlight edge -->
    <path d="M 290 108
             L 326 108
             L 266 222
             L 318 222
             L 222 404
             L 248 274
             L 198 274 Z"
          stroke="url(#bolt-shine)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- "26" label at bottom -->
  <g>
    <rect x="196" y="400" width="120" height="34" rx="5" fill="#0b0b10" stroke="#f0c040" stroke-width="1.5" opacity="0.9"/>
    <text x="256" y="424" text-anchor="middle"
          font-family="'Barlow Condensed', 'Impact', sans-serif"
          font-weight="900" font-size="22" letter-spacing="5"
          fill="#f0c040">26</text>
  </g>

  <!-- "ARENA" top label -->
  <text x="256" y="92" text-anchor="middle"
        font-family="'Barlow Condensed', 'Impact', sans-serif"
        font-weight="700" font-size="16" letter-spacing="10"
        fill="rgba(255,255,255,0.6)">ARENA</text>
</svg>
