<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="hex-wm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="ring-wm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#c8102e"/>
    </linearGradient>
    <linearGradient id="bolt-wm" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <filter id="glow-wm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mini hexagon icon (32×56 area, centered at x=28 y=32) -->
  <path d="M 28 6
           L 52 18
           L 52 46
           L 28 58
           L 4 46
           L 4 18 Z"
        fill="url(#hex-wm)"/>

  <!-- Hexagon red border -->
  <path d="M 28 6
           L 52 18
           L 52 46
           L 28 58
           L 4 46
           L 4 18 Z"
        stroke="url(#ring-wm)" stroke-width="1.8" fill="none" opacity="0.85"/>

  <!-- Corner accent dots -->
  <circle cx="28" cy="6" r="2" fill="#c8102e" filter="url(#glow-wm)"/>
  <circle cx="28" cy="58" r="2" fill="#c8102e" filter="url(#glow-wm)"/>

  <!-- Lightning bolt inside hex -->
  <g filter="url(#glow-wm)">
    <path d="M 31 12
             L 21 32
             L 27.5 32
             L 25 52
             L 35 34
             L 28.5 34
             L 35 12 Z"
          fill="url(#bolt-wm)"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="66" y1="14" x2="66" y2="50" stroke="rgba(200,16,46,0.3)" stroke-width="1"/>

  <!-- Main wordmark text -->
  <!-- "FC 26" large -->
  <text x="77" y="36"
        font-family="'Barlow Condensed', 'Impact', sans-serif"
        font-weight="900" font-size="26" letter-spacing="2"
        fill="#ffffff">FC 26</text>

  <!-- "ARENA" subtitle -->
  <text x="78" y="52"
        font-family="'Barlow Condensed', 'Impact', sans-serif"
        font-weight="700" font-size="11" letter-spacing="7"
        fill="#c8102e">ARENA</text>

  <!-- Gold accent dot + "PRO" tag at far right -->
  <circle cx="228" cy="32" r="2" fill="#f0c040" opacity="0.8"/>
  <text x="235" y="36"
        font-family="'Barlow Condensed', 'Impact', sans-serif"
        font-weight="700" font-size="10" letter-spacing="3"
        fill="rgba(255,255,255,0.4)">PRO</text>
</svg>
